<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />

    <body>

                    <ul class="brand__list">

                        </li>
                        <li class="brand__item">
                            <img src="image/samsung.png" alt="samsung" />
                            <button class="brand__btn"></button>
                        </li>
                        <li class="brand__item">
                            <img src="image/apple.png" alt="apple" />
                            <button class="brand__btn"></button>
                        </li>
                        <li class="brand__item">
                            <img src="image/sonic.png" alt="sonic" />
                            <button class="brand__btn"></button>
                        </li>
                        <li class="brand__item">
                            <img src="image/bosch.png" alt="bosch" />

                        </li>
                        <li class="brand__item">
                            <img src="image/hp.png" alt="hp" />

                        <li class="brand__item">
                            <img src="image/sony.png" alt="sony" />

                        </li>

                            <img src="image/lenovo.png" alt="lenovo" />
                            <button class="brand__btn"></button>
                        </li>
                        <li class="brand__item">
                            <img src="image/samsung.png" alt="samsung" />
                            <button class="brand__btn"></button>
                        </li>
                        <li class="brand__item">
                            <img src="image/apple.png" alt="apple" />
                            <button class="brand__btn"></button>
                        </li>
                    </ul>

                    <div class="btn-arr-sh">
                        <button class="btn-arr" id="showBrand">Показать все</button>
                        <button class="btn-arr cls-arr" id="hideBrand">Скрыть</button>
                    </div>

                    <div class="swiper">
                        <div class="swiper-wrapper"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </section>

                <!-- тип , цена -->
            </main>

            <footer></footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
        <script src="script.js"></script>

</html>
