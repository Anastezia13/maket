<!DOCTYPE html>

<html lang="ru" class="total-class">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="styles.css" />

		<title>Услуги и сервисы</title>
		<!--иконка вкладки-->
	</head>

	<body>
		<header class="header">
			<div class="header__Layout">
				<!---->
				<!--меню бурер сделать по другому ПЕРЕДЕЛАТЬ -->
				<nav class="menu">
					<button class="header__button">
						<img
							src="image/header/header/burger.png"
							alt="burger"
						/>
					</button>
					<!--
					<ul class="menu-items">
						<li>главная</li>
						<li>не главная</li>
						<li>третья</li>
					</ul>
					-->
				</nav>

				<!--логотип. обернуть ? <a> href="#" class="" </a>...-->
				<div class="logo">
					<img src="image/header/header/Group.png" alt="logo CPS" />
				</div>

				<!--кнопки 1 и 2-->
				<div class="buttons">
					<button class="header__button">
						<img
							src="image/header/header/repair.png"
							alt="repair"
						/>
					</button>
					<button class="header__button">
						<img
							src="image/header/header/checkstatus.png"
							alt="checkstatus"
						/>
					</button>
				</div>
			</div>
		</header>

		<main>
			<div class="main-layout">
				<section class="about">
					<div class="about__title">
						<!--<div class="about__title__"> </div> название __ поменять-->
						<span class="title__line"></span>
						<h1 class="title__text">Услуги и сервисы</h1>
						</div>
					</div>
					<div class="container">
						
						<article class="about__text">
							<p>
								Мы являемся авторизованным сервисным центром по ремонту техники Dell. 
								Только у нас вы можете отремонтировать свой ноутбук Dell с официальной гарантией производителя.
							</p>
							<p>
								Мы успешно работаем с 1992 года и заслужили репутацию надежного партнера
							</p>

							<img class="photo1" src="/image/photo1.png">

						</article>

						<button class="button__arrow">
							 Читать далее
						</button>
						

					</div>
				</section>
			</div>
		</main>

		<footer></footer>
	</body>
</html>
